[project]
name = "model-abliteration-pipeline"
version = "1.0.0"
description = "Project A: reproducible, configurable CLI platform for model abliteration (Heretic) and quantization (FP8/GGUF)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0 (this repository); third-party tools keep their own licenses, see LICENSE-THIRD-PARTY.md" }
# Control-plane dependencies only. ML stacks live in separate, pinned tool environments (stage 01).
dependencies = [
    "pyyaml>=6.0.2,<7",
    "huggingface-hub>=1.0,<3",
    "tomli>=2.0; python_version < '3.11'",
    "psutil>=6.0",
    "uv==0.13.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "jsonschema>=4.23",
    "ruff>=0.6",
]

[project.scripts]
model-pipeline = "model_pipeline.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs a real NVIDIA GPU and provisioned tool components (run on the B200 only)",
    "realtools: real pinned tools on CPU with network (opt-in, see tests/realtools)",
]
addopts = "-m 'not gpu and not realtools'"

[tool.ruff]
line-length = 160
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]
